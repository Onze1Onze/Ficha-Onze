<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111512" />
    <meta name="description" content="Painel individual de armas e gerenciamento de munição para Owlbear Rodeo." />
    <title>Arsenal de Munição</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main id="app" aria-label="Arsenal de armas e munição">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-name">ARSENAL</span>
        </div>
        <span class="sync-status" id="sync-status" title="Estado da sincronização">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="sync-label">LOCAL</span>
        </span>
      </header>

      <section class="weapons-section" aria-labelledby="weapons-label">
        <div class="section-heading">
          <span class="section-label" id="weapons-label">ARMAS</span>
          <span class="section-meta" id="weapon-total">08 DISPONÍVEIS</span>
        </div>
        <div class="weapon-grid" id="weapon-grid" role="group" aria-label="Selecionar arma"></div>
      </section>

      <section class="ammo-section" aria-labelledby="ammo-label">
        <div class="ammo-heading">
          <div class="ammo-title-wrap">
            <span class="section-label" id="ammo-label">CARREGADOR</span>
            <strong class="selected-weapon" id="selected-weapon">PISTOLA</strong>
          </div>
          <div class="ammo-counter" aria-live="polite" aria-atomic="true">
            <strong id="ammo-remaining">12</strong>
            <span class="counter-divider">/</span>
            <span id="ammo-capacity">12</span>
            <span class="counter-unit">BALAS</span>
          </div>
        </div>
        <div class="ammo-tray" id="ammo-tray" tabindex="0" aria-label="Munições do carregador"></div>
      </section>

      <footer class="action-bar">
        <button class="action-button reload-button" id="reload-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4.8 9A7.5 7.5 0 0 1 18 6.5L20 12M4 17v-5h5m10.2 3A7.5 7.5 0 0 1 6 17.5L4 12"/></svg>
          <span>RECARREGAR</span>
        </button>
        <button class="action-button burst-button" id="burst-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 5 13h5l-.5 9L19 10h-5l-.5-8Z"/></svg>
          <span>DISPARADA</span>
          <span class="burst-cost">−10</span>
        </button>
      </footer>
      <div class="sr-only" id="status-announcement" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
